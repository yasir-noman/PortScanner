<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Advanced Port Scanner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="terminal-container">
    <div class="terminal-header">
      <span class="dot red"></span>
      <span class="dot yellow"></span>
      <span class="dot green"></span>
      <span class="title">root@kali: ~/port-scanner</span>
    </div>
    
    <div class="terminal-body">
      <p class="line">[+] Initializing Advanced Port Scanner...</p>
      <p class="line">[+] Target Host: <input type="text" id="target-input" placeholder="127.0.0.1 or scanme.nmap.org" autocomplete="off"></p>
      <p class="line">[+] Scanning Top 1000 TCP Ports</p>
      
      <button id="scan-btn">[ EXECUTE SCAN ]</button>
      
    
      <div id="progress-container" class="hidden">
        <p class="line loading-text">[*] Scanning ports... Please wait, this might take a few seconds.</p>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" id="progress-fill"></div>
        </div>
      </div>
      
      <div id="output-area" class="hidden">
        <p class="line success" id="res-header"></p>
        
        <table id="results-table">
          <thead>
            <tr>
              <th>PORT</th>
              <th>STATUS</th>
              <th>SERVICE</th>
            </tr>
          </thead>
          <tbody id="table-body">
          
          </tbody>
        </table>
        
        <p class="line" id="no-ports" style="display:none; color: #ff5555;">[-] No open ports found.</p>
      </div>
      
      <p id="error-msg" class="line error hidden"></p>
    </div>
  </div>
  
  <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
